<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SS Movie Box</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0b0f19;
      color: #ffffff;
      padding: 12px;
      padding-bottom: 70px;
    }

    /* হেডার ও ৩-ডট মেনু */
    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 5px 0 15px 0;
      position: relative;
    }

    .header-bar h1 {
      font-size: 20px;
      color: #38bdf8;
      font-weight: 800;
      text-align: center;
      width: 100%;
    }

    .menu-btn {
      position: absolute;
      right: 0;
      top: 0;
      background: #1e293b;
      border: 1px solid #38bdf8;
      color: #38bdf8;
      font-size: 20px;
      padding: 4px 14px;
      border-radius: 8px;
      cursor: pointer;
      z-index: 10;
    }

    /* ৩-ডটের ড্রপডাউন মেনু */
    .dropdown-menu {
      display: none;
      position: absolute;
      right: 0;
      top: 45px;
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      z-index: 99999;
      width: 170px;
      overflow: hidden;
    }

    .dropdown-menu div {
      padding: 12px 14px;
      font-size: 14px;
      color: #f1f5f9;
      cursor: pointer;
      border-bottom: 1px solid #334155;
    }

    .dropdown-menu div:last-child {
      border-bottom: none;
    }

    .dropdown-menu div:active {
      background: #0284c7;
      color: #fff;
    }

    /* অ্যাপে ঢোকার ব্যানার অ্যাড */
    .entry-ad-banner {
      background: linear-gradient(135deg, #1e3a8a, #0284c7);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      margin-bottom: 15px;
      border: 1px dashed #38bdf8;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .entry-ad-banner p {
      font-size: 13px;
      color: #f8fafc;
      font-weight: bold;
    }
    .entry-ad-banner span {
      font-size: 11px;
      background: #facc15;
      color: #000;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 800;
      margin-right: 5px;
    }

    /* সার্চ বক্স */
    .search-box {
      margin-bottom: 15px;
    }
    .search-box input {
      width: 100%;
      padding: 12px 15px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    /* মুভি গ্রিড */
    .movies-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      min-height: 200px;
    }

    .movie-card {
      background: #1e293b;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
    }

    .movie-card img {
      width: 100%;
      height: 210px;
      object-fit: cover;
      background: #0f172a;
    }

    .movie-info {
      padding: 10px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .movie-title {
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .movie-meta {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #facc15;
      margin-bottom: 10px;
    }

    .dl-trigger-btn {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 8px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }

    /* ডাউনলোড মডাল */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100000;
      padding: 20px;
    }

    .modal-content {
      background: #1e293b;
      border-radius: 14px;
      padding: 20px;
      text-align: center;
      width: 100%;
      max-width: 320px;
      border: 1px solid #475569;
    }

    .modal-content h3 {
      font-size: 16px;
      color: #38bdf8;
      margin-bottom: 8px;
    }

    .ad-status-box {
      background: #0f172a;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      margin: 12px 0;
      border: 1px solid #334155;
      color: #94a3b8;
    }

    .action-btn {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      border: none;
    }

    .btn-ad1 { background: #eab308; color: #000; }
    .btn-ad2 { background: #f97316; color: #fff; }
    .btn-dl { background: #22c55e; color: #fff; }

    .action-btn:disabled {
      background: #475569 !important;
      color: #cbd5e1 !important;
      cursor: not-allowed;
    }

    .close-btn {
      margin-top: 15px;
      background: transparent;
      border: 1px solid #64748b;
      color: #94a3b8;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <!-- হেডার ও ৩-ডট মেনু -->
  <div class="header-bar">
    <h1>🎬 SS MOVIE BOX</h1>
    <button class="menu-btn" onclick="toggleMenu(event)">⋮</button>
    
    <!-- ৫টি ক্যাটাগরি মেনু -->
    <div class="dropdown-menu" id="dropdownMenu">
      <div onclick="selectCategory('All', event)">🌐 All (সকল)</div>
      <div onclick="selectCategory('Bangla', event)">🇧🇩 Bangla</div>
      <div onclick="selectCategory('Hindi', event)">🇮🇳 Hindi</div>
      <div onclick="selectCategory('South', event)">⚡ South</div>
      <div onclick="selectCategory('Hollywood', event)">🎬 Hollywood</div>
    </div>
  </div>

  <!-- স্পন্সর ব্যানার অ্যাড -->
  <div class="entry-ad-banner" onclick="openEntryAd()">
    <p><span>SPONSOR</span> স্পন্সরড অফার দেখতে এখানে ক্লিক করুন 🎁</p>
  </div>

  <!-- সার্চ বক্স -->
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="মুভির নাম খুঁজুন..." onkeyup="filterMovies()">
  </div>

  <!-- মুভির তালিকা -->
  <div class="movies-grid" id="moviesList">
    <!-- জাভাস্ক্রিপ্ট দিয়ে মুভি কার্ড এখানে অটো লোড হবে -->
  </div>

  <!-- পপআপ মডাল -->
  <div class="modal-overlay" id="downloadModal">
    <div class="modal-content">
      <h3 id="modalTitle">মুভির নাম</h3>
      <div class="ad-status-box" id="modalStatus">ডাউনলোড করতে ১ম অ্যাডটি দেখুন।</div>

      <button class="action-btn btn-ad1" id="mainActionBtn" onclick="handleAdClick()">
        👉 ধাপ ১: ১ম অ্যাড চালু করুন (১০ সে.)
      </button>

      <br>
      <button class="close-btn" onclick="closeModal()">বন্ধ করুন</button>
    </div>
  </div>

  <script>
    // নিরাপদভাবে Telegram SDK লোড
    var tg = null;
    if (window.Telegram && window.Telegram.WebApp) {
      tg = window.Telegram.WebApp;
      try {
        tg.ready();
        tg.expand();
      } catch (e) {}
    }

    var ENTRY_AD_URL = "https://auctionr.org/4/65f43ffc33fe79a1323bfe7402ae52f3";

    function openEntryAd() {
      if (tg && tg.openLink) {
        tg.openLink(ENTRY_AD_URL);
      } else {
        window.open(ENTRY_AD_URL, '_blank');
      }
    }

    // মুভির তালিকা
    var movies = [
      {
        id: 1,
        title: "The Paradise (2026)",
        category: "South",
        rating: "⭐ 8.5/10",
        image: "https://th-i.thgim.com/public/entertainment/movies/khrwfv/article69908639.ece/alternates/FREE_1200/Nani.jpeg",
        ad1: "https://auctionr.org/4/65f43ffc33fe79a1323bfe7402ae52f3",
        ad2: "https://asiafilm.org/4/13ea836dfdd1e0cc3f590b100bff3fb6",
        downloadUrl: "https://t.me/vitarvideo_bot?start=1b340da3-124b-4802-b580-720ec1ff37b8"
      },
      {
        id: 2,
        title: "Jawan (2023)",
        category: "Hindi",
        rating: "⭐ 7.5/10",
        image: "https://image.tmdb.org/t/p/w500/jA5L2W6n0D6h5n9p0o1t8v9h.jpg",
        ad1: "https://auctionr.org/4/65f43ffc33fe79a1323bfe7402ae52f3",
        ad2: "https://asiafilm.org/4/13ea836dfdd1e0cc3f590b100bff3fb6",
        downloadUrl: "https://t.me/vitarvideo_bot"
      }
    ];

    var currentMovie = null;
    var adStep = 1; 
    var timerInterval = null;
    var activeCategory = 'All';

    // ৩-ডট মেনু ওপেন/ক্লোজ (মোবাইলে একদম ঠিকভাবে কাজ করবে)
    function toggleMenu(event) {
      if (event) event.stopPropagation();
      var menu = document.getElementById('dropdownMenu');
      menu.style.display = (menu.style.display === 'block') ? 'none' : 'block';
    }

    // ক্যাটাগরি বাছাই করা
    function selectCategory(cat, event) {
      if (event) event.stopPropagation();
      activeCategory = cat;
      document.getElementById('dropdownMenu').style.display = 'none';
      filterMovies();
    }

    // স্ক্রিনের বাইরে ক্লিক করলে মেনু বন্ধ হওয়া
    document.addEventListener('click', function(e) {
      var menu = document.getElementById('dropdownMenu');
      if (menu && menu.style.display === 'block') {
        menu.style.display = 'none';
      }
    });

    // মুভি কার্ড লোড করা
    function renderMovies(list) {
      var container = document.getElementById('moviesList');
      container.innerHTML = '';
      if (!list || list.length === 0) {
        container.innerHTML = '<p style="grid-column: span 2; text-align: center; color: #94a3b8; padding: 30px;">কোনো ভিডিও পাওয়া যায়নি!</p>';
        return;
      }
      for (var i = 0; i < list.length; i++) {
        var m = list[i];
        var card = document.createElement('div');
        card.className = 'movie-card';
        card.innerHTML = 
          '<img src="' + m.image + '" alt="' + m.title + '">' +
          '<div class="movie-info">' +
            '<div>' +
              '<div class="movie-title">' + m.title + '</div>' +
              '<div class="movie-meta"><span>' + m.rating + '</span><span>' + m.category + '</span></div>' +
            '</div>' +
            '<button class="dl-trigger-btn" onclick="openModal(' + m.id + ')">ডাউনলোড</button>' +
          '</div>';
        container.appendChild(card);
      }
    }

    // ফিল্টার এবং সার্চ
    function filterMovies() {
      var q = document.getElementById('searchInput').value.toLowerCase();
      var filtered = [];
      for (var i = 0; i < movies.length; i++) {
        var m = movies[i];
        var matchesCategory = (activeCategory === 'All') || (m.category === activeCategory);
        var matchesSearch = m.title.toLowerCase().indexOf(q) !== -1;
        if (matchesCategory && matchesSearch) {
          filtered.push(m);
        }
      }
      renderMovies(filtered);
    }

    // পপআপ মডাল
    function openModal(id) {
      for (var i = 0; i < movies.length; i++) {
        if (movies[i].id === id) {
          currentMovie = movies[i];
          break;
        }
      }
      adStep = 1;
      clearInterval(timerInterval);

      document.getElementById('modalTitle').innerText = currentMovie.title;
      document.getElementById('modalStatus').innerHTML = "ডাউনলোড আনলক করতে <b>১ম বিজ্ঞাপনটি</b> দেখুন।";
      
      var btn = document.getElementById('mainActionBtn');
      btn.className = "action-btn btn-ad1";
      btn.innerText = "👉 ধাপ ১: ১ম অ্যাড চালু করুন (১০ সে.)";
      btn.disabled = false;
      btn.onclick = handleAdClick;

      document.getElementById('downloadModal').style.display = 'flex';
    }

    // অ্যাড ও টাইমার হ্যান্ডেল
    function handleAdClick() {
      var btn = document.getElementById('mainActionBtn');
      var status = document.getElementById('modalStatus');
      btn.disabled = true;

      var targetAd = (adStep === 1) ? currentMovie.ad1 : currentMovie.ad2;
      if (tg && tg.openLink) {
        tg.openLink(targetAd);
      } else {
        window.open(targetAd, '_blank');
      }

      var count = 10;
      status.innerHTML = '<span style="color:#38bdf8;">বিজ্ঞাপন ওপেন হয়েছে... অনুগ্রহ করে ১০ সেকেন্ড অপেক্ষা করুন।</span>';
      btn.innerText = '⏳ অপেক্ষা করুন (' + count + 's)...';

      timerInterval = setInterval(function() {
        count--;
        btn.innerText = '⏳ অপেক্ষা করুন (' + count + 's)...';

        if (count <= 0) {
          clearInterval(timerInterval);

          if (adStep === 1) {
            adStep = 2;
            status.innerHTML = "✅ ১ম অ্যাড দেখা শেষ! এবার <b>২য় অ্যাডটি</b> দেখুন।";
            btn.className = "action-btn btn-ad2";
            btn.innerText = "👉 ধাপ ২: শেষ অ্যাড চালু করুন (১০ সে.)";
            btn.disabled = false;
          } else {
            status.innerHTML = "<b style='color:#4ade80;'>🎉 ২টি বিজ্ঞাপন সফলভাবে শেষ হয়েছে!</b>";
            btn.className = "action-btn btn-dl";
            btn.innerText = "📥 আসল মুভি ডাউনলোড করুন 🎬";
            btn.disabled = false;
            btn.onclick = downloadFinalMovie;
          }
        }
      }, 1000);
    }

    // ডাউনলোড লিংক ওপেন
    function downloadFinalMovie() {
      if (tg && tg.openLink) {
        tg.openLink(currentMovie.downloadUrl);
      } else {
        window.open(currentMovie.downloadUrl, '_blank');
      }
      closeModal();
    }

    function closeModal() {
      clearInterval(timerInterval);
      document.getElementById('downloadModal').style.display = 'none';
    }

    // পেজ লোড হলেই মুভিগুলো শো করবে
    window.onload = function() {
      renderMovies(movies);
    };
    renderMovies(movies);
  </script>
</body>
</html>
